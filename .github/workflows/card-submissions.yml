name: 卡面投稿入库

on:
  issues:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/scripts/requirements.txt
      - run: python -m unittest discover -s Tests -p 'test_card_submissions.py' -v
      - name: 检查 GitHub 令牌与卡面索引（只读）
        run: python .github/scripts/check_submission_environment.py
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    if: github.event_name == 'issues' && github.event.label.name == '审核通过' && github.repository == 'Feryquence/AirCard'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: read
    concurrency:
      group: card-submission-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Never check out or execute the cards branch or contributor code.
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/scripts/requirements.txt
      - name: 校验并写入 cards 分支
        run: python .github/scripts/card_submissions.py
        env:
          GH_TOKEN: ${{ github.token }}
